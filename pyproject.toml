[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsm-compaction-lab"
version = "0.1.0"
description = "Deterministic LSM compaction tradeoff simulator"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
lsm-compaction-lab = "lsmlab.cli:main"

[tool.setuptools]
packages = ["lsmlab"]
